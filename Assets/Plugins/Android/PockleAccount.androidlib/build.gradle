apply plugin: 'com.android.library'
android {
 namespace 'studio.pockle.account'
 compileSdk getProperty('unity.compileSdkVersion') as int
 buildToolsVersion getProperty('unity.buildToolsVersion')
 defaultConfig { consumerProguardFiles 'consumer-rules.pro'; minSdk getProperty('unity.minSdkVersion') as int; targetSdk getProperty('unity.targetSdkVersion') as int }
 sourceSets { main { manifest.srcFile 'AndroidManifest.xml'; java.srcDirs = ['src'] } }
}
